name: Apply Humanoid Motion Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-motion-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route humanoids through analytic gait solver
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#res://scripts/humanoid_rig.gd#res://scripts/humanoid_motion.gd#g' scripts/player.gd scripts/enemy.gd
          grep -q 'humanoid_motion.gd' scripts/player.gd
          grep -q 'humanoid_motion.gd' scripts/enemy.gd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/player.gd scripts/enemy.gd
          git commit -m 'Route player and enemies through analytic gait solver'
          git push origin HEAD:main
