name: Bootstrap Kinetic Foundry Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical repo
        uses: actions/checkout@v4

      - name: Fetch current Kinetic Foundry source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch kinetic-foundry https://github.com/IssisX/IssisX.git /tmp/legacy
          rsync -a --exclude='.git' /tmp/legacy/kinetic-foundry/ ./

      - name: Commit complete migrated project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate complete Kinetic Foundry project into canonical repo'
          git push origin HEAD:main
