name: Kinetic Foundry Visual Capture

on:
  push:
    branches: [main, Grok]
    paths:
      - ".capture-request"
      - ".github/workflows/visual-capture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip capture]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    name: Render deterministic screenshots

    env:
      GODOT_BIN: /tmp/Godot_v4.3-stable_linux.x86_64
      CAPTURE_DIR: ${{ github.workspace }}/captures/latest
      LIBGL_ALWAYS_SOFTWARE: "1"
      KF_CAPTURE: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Godot 4.3 renderer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Import project cleanly
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$GODOT_BIN" --headless --path . --import --quit --audio-driver Dummy 2>&1 | tee /tmp/kinetic-import.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR:|Failed to load script|Failed to create an autoload|Failed to instantiate an autoload' /tmp/kinetic-import.log; then
            echo "GODOT_IMPORT_SCRIPT_FAILURE"
            grep -E 'SCRIPT ERROR:|Failed to load script|Failed to create an autoload|Failed to instantiate an autoload' /tmp/kinetic-import.log
            exit 21
          fi
          if [ ! -f .godot/global_script_class_cache.cfg ]; then
            echo "MISSING_GLOBAL_CLASS_CACHE"
            exit 21
          fi
          if ! grep -q FoundryMaterial .godot/global_script_class_cache.cfg; then
            echo "GLOBAL_CLASS_CACHE_MISSING_FOUNDRY_MATERIAL"
            cat .godot/global_script_class_cache.cfg
            exit 21
          fi

      - name: Render capture suite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CAPTURE_DIR"
          mkdir -p "$CAPTURE_DIR"
          set +e
          timeout --signal=TERM 58s xvfb-run -a -s "-screen 0 1800x1500x24" \
            "$GODOT_BIN" --path . --audio-driver Dummy 2>&1 | tee /tmp/kinetic-capture.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 124 ]; then echo "CAPTURE_TIMEOUT"; exit 124; fi
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR:|Failed to load script|Failed to create an autoload|Failed to instantiate an autoload' /tmp/kinetic-capture.log; then
            echo "GODOT_RUNTIME_SCRIPT_FAILURE"
            grep -E 'SCRIPT ERROR:|Failed to load script|Failed to create an autoload|Failed to instantiate an autoload' /tmp/kinetic-capture.log
            exit 22
          fi
          grep -q 'CAPTURE_STAGE activation' /tmp/kinetic-capture.log
          grep -q 'CAPTURE_SUITE_OK' /tmp/kinetic-capture.log

      - name: Verify capture set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            01_yard_overview.png
            02_grounded_combat.png
            03_excavator_load_control.png
            04_progressive_structure_damage.png
            05_collapse_aftermath.png
            06_breached_route.png
            07_walk_single_support.png
            08_walk_double_support.png
            09_crane_suspended_load.png
          )
          for name in "${expected[@]}"; do
            file="$CAPTURE_DIR/$name"
            test -s "$file"
            test "$(stat -c%s "$file")" -gt 10000
          done

      - name: Upload screenshot artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: KineticFoundry-Screenshots-${{ github.run_number }}
          path: captures/latest/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit latest captures for visual review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A captures/latest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[skip capture] Update Kinetic Foundry visual captures"
          git push origin HEAD:${{ github.ref_name }}
