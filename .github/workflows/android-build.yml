name: Kinetic Foundry Android Build

on:
  push:
    branches: [main, Grok]
    paths:
      - ".milestone-build"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    name: Export Android APK

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Godot scripts
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          GODOT_BIN=/tmp/Godot_v4.3-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          set +e
          "$GODOT_BIN" --headless --path . --editor --quit --audio-driver Dummy 2>&1 | tee /tmp/kinetic-preflight.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR:|Failed to load script|Failed to create an autoload|Failed to instantiate an autoload' /tmp/kinetic-preflight.log; then
            echo "ANDROID_BUILD_BLOCKED_BY_SCRIPT_ERRORS"
            grep -E 'SCRIPT ERROR:|Failed to load script|Failed to create an autoload|Failed to instantiate an autoload' /tmp/kinetic-preflight.log
            exit 21
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 requirements
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Export Godot Android debug build
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true
          use_preset_export_path: true

      - name: Verify and normalize APK
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="build/android"
          APK="$OUT_DIR/KineticFoundry-debug.apk"
          FOUND_APK="$(find "$OUT_DIR" -type f -name '*.apk' -print -quit)"
          test -n "$FOUND_APK"
          if [ "$FOUND_APK" != "$APK" ]; then cp "$FOUND_APK" "$APK"; fi
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload playable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KineticFoundry-Android-${{ github.run_number }}
          path: build/android/KineticFoundry-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kinetic-foundry-build-${{ github.run_number }}
          name: Kinetic Foundry Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: build/android/KineticFoundry-debug.apk
